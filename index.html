<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ラムサウンディング柱状図</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: 現場技術者の道具。静かで正確、図面のような細い罫線。
   IDEA: 方眼のトレーシングペーパーに描く柱状図。プレビュー自体が成果物。
   PICTURE: 右側の A4 シート（そのまま DXF になる図）。
   COLOUR and TYPE: 白地＋墨、アクセントは測量ペンの青 #1f5fbf。Noto Sans JP。
   LAYOUT: 左に入力（地点→データ→土質→情報→設定）、右に図面。600px 以下は縦積み。 */
:root{color-scheme:light dark;--bg:light-dark(#f4f5f2,#16181a);--panel:light-dark(#fff,#1f2225);--ink:light-dark(#1b1d1f,#e8e9e6);--sub:light-dark(#62676c,#a3a9ad);--line:light-dark(#d9dcd6,#33383c);--acc:light-dark(#1f5fbf,#78a8ff);--accbg:light-dark(#e8f0fc,#1c2a40);--warn:light-dark(#b3261e,#ff8a80)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Noto Sans JP",system-ui,sans-serif;overflow-x:clip}
header{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:12px max(2vw,14px);background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
h1{font-size:19px;margin:0;font-weight:700;letter-spacing:.02em}
h1 small{font-weight:400;color:var(--sub);font-size:13px;margin-left:8px}
.sp{flex:1}
button,.btn{font:inherit;font-size:14px;min-height:38px;padding:6px 14px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--acc)}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:500}
button.sm{min-height:32px;padding:3px 10px;font-size:13px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
main{display:grid;grid-template-columns:minmax(0,520px) minmax(0,1fr);gap:16px;padding:16px max(2vw,14px);align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.pts{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:12px}
.chip{border-radius:999px;padding:4px 14px;min-height:34px}
.chip.on{background:var(--accbg);border-color:var(--acc);color:var(--acc);font-weight:700}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:0 -14px 12px;padding:0 14px;overflow-x:auto}
.tabs button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;padding:6px 12px}
.tabs button.on{border-bottom-color:var(--acc);color:var(--acc);font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.note{color:var(--sub);font-size:13px;margin:6px 0}
.grid{max-height:min(60vh,620px);overflow:auto;border:1px solid var(--line);border-radius:6px}
table.g{border-collapse:collapse;width:100%;font-size:14px}
.g th{position:sticky;top:0;background:var(--panel);font-weight:500;font-size:12px;color:var(--sub);padding:4px;border-bottom:1px solid var(--line);text-align:center;line-height:1.25;z-index:1}
.g td{border-bottom:1px solid var(--line);padding:0}
.g td.c{text-align:right;padding:0 8px;font-variant-numeric:tabular-nums;color:var(--sub);white-space:nowrap}
.g td.i{width:30px;text-align:center;color:var(--sub);font-size:12px}
.g input{width:100%;border:0;background:transparent;color:var(--ink);font:inherit;font-size:16px;padding:6px 6px;text-align:right;font-variant-numeric:tabular-nums;min-height:34px}
.g input.t{text-align:left}
.g input::placeholder{color:var(--sub);opacity:.4}
.g tr:focus-within td{background:var(--accbg)}
.g td.x button{border:0;background:none;color:var(--sub);min-height:30px;padding:0 8px}
.form{display:grid;grid-template-columns:7.5em minmax(0,1fr);gap:8px 10px;align-items:center}
.form label{font-size:13px;color:var(--sub)}
.form input,.form select,.form textarea,.mini{font:inherit;font-size:16px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);width:100%;min-height:38px}
.mini{width:5.5em;min-height:34px;padding:4px 6px}
.form .full{grid-column:1/-1}
h3{font-size:14px;margin:14px 0 6px}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink)}
.chk input{width:18px;height:18px;min-height:0}
.view{position:sticky;top:76px}
.vbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.pages{display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 150px);overflow:auto;padding:4px}
.paper{background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.15),0 6px 24px rgba(0,0,0,.08);aspect-ratio:210/297;width:100%;max-width:720px;margin:0 auto}
.paper svg,.sheet svg{display:block;width:100%;height:100%}
.sheet{background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.15),0 6px 24px rgba(0,0,0,.08);margin:0 auto}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;min-height:38px}
.seg button.on{background:var(--acc);color:#fff;font-weight:500}
.sum{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:13px;color:var(--sub)}
.sum b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);padding:18px;width:min(760px,94vw);max-height:90vh}
dialog::backdrop{background:rgba(0,0,0,.35)}
.prev{overflow:auto;max-height:240px;border:1px solid var(--line);border-radius:6px;margin:8px 0}
.prev table{border-collapse:collapse;font-size:12px}
.prev td{border:1px solid var(--line);padding:2px 6px;white-space:nowrap}
.prev tr.hd td{background:var(--accbg);font-weight:700}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;z-index:20}
.toast.on{opacity:1}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
@media(max-width:1000px){main{grid-template-columns:minmax(0,1fr)}.view{position:static}.pages{max-height:none}}
@media(max-width:600px){header{position:static}.form{grid-template-columns:minmax(0,1fr)}h1 small{display:block;margin:0}}
</style>
</head>
<body>
<header>
  <h1>ラムサウンディング柱状図<small>Nd値の表・グラフを入力して DXF に出力</small></h1>
  <span class="sp"></span>
  <button id="bOpen">プロジェクトを開く</button>
  <button id="bSave">プロジェクト保存</button>
  <input type="file" id="fProj" accept=".json" hidden>
</header>

<main>
<section class="card">
  <div class="pts" id="pts"></div>
  <div class="tabs" role="tablist" id="tabs">
    <button data-t="data" class="on">データ</button>
    <button data-t="layer">土質・記事</button>
    <button data-t="info">地点情報</button>
    <button data-t="set">共通設定</button>
  </div>

  <div data-p="data">
    <div class="row">
      <button class="sm" id="bImport">Excel / CSV 読込</button>
      <input type="file" id="fXls" accept=".xlsx,.xlsm,.xls,.csv,.txt" hidden>
      <button class="sm" id="bAdd1">＋1行</button>
      <button class="sm" id="bAdd10">＋10行</button>
      <button class="sm" id="bClear">全削除</button>
    </div>
    <div class="row note">
      深度を振り直す：開始 GL-<input class="mini" id="rnStart" value="0.00" inputmode="decimal">m
      刻み<input class="mini" id="rnStep" value="0.20" inputmode="decimal">m
      <button class="sm" id="bRenum">実行</button>
    </div>
    <div class="grid"><table class="g" id="gData"></table></div>
    <p class="note">Excel の範囲をコピーして任意のセルに貼り付けると、その位置から下・右へ流し込みます（列順：深度・打撃回数・貫入量・トルク）。Enter で下のセルへ移動、最終行では行を追加します。</p>
    <div class="sum" id="sum"></div>
  </div>

  <div data-p="layer" hidden>
    <p class="note">下端深度ごとに推定土質を入力します。簡易柱状図では土質柱状の模様（自動判定または手動選択）と境界深度、A4 シートでは「標高・層厚・深度・推定土質・記事」欄に描画されます。出力の有無は右上の「土層あり」で切り替えます。</p>
    <div class="row"><button class="sm" id="bLAdd">＋層を追加</button></div>
    <div class="grid"><table class="g" id="gLayer"></table></div>
  </div>

  <div data-p="info" hidden>
    <div class="form" id="fInfo"></div>
  </div>

  <div data-p="set" hidden>
    <div class="form" id="fSet"></div>
  </div>
</section>

<section class="view">
  <div class="vbar">
    <div class="seg" id="seg" role="group" aria-label="出力形式"><button data-out="simple">簡易柱状図</button><button data-out="sheet">A4 シート</button></div>
    <label class="chk"><input type="checkbox" id="qSoil">土層あり</label>
  </div>
  <div class="vbar">
    <button class="pri" id="bDxf">この地点を DXF 出力</button>
    <button id="bDxfAll">全地点を DXF（1ファイル）</button>
    <button id="bCsv">計算表 CSV</button>
    <span class="note" id="dlNote"></span>
  </div>
  <div class="pages" id="pages"></div>
</section>
</main>

<dialog id="dImp">
  <h3 style="margin-top:0">Excel / CSV の取込</h3>
  <div class="row">
    <label class="note">シート <select class="mini" style="width:12em" id="iSheet"></select></label>
    <label class="note">見出し行 <input class="mini" id="iHead" type="number" min="0"></label>
    <span class="note">（0 = 見出しなし）</span>
  </div>
  <div class="prev" id="iPrev"></div>
  <div class="form" id="iMap"></div>
  <div class="row">
    <label class="chk"><input type="checkbox" id="iAuto">深度列が無い／空欄の行は開始深度から 0.20m 刻みで付番</label>
  </div>
  <div class="row">
    <label class="note">取込先
      <select class="mini" style="width:14em" id="iDest">
        <option value="replace">この地点のデータを置換</option>
        <option value="append">この地点の末尾に追加</option>
        <option value="new">新しい地点として追加</option>
      </select></label>
  </div>
  <div class="row" style="justify-content:flex-end">
    <button id="iCancel">キャンセル</button><button class="pri" id="iOk">取り込む</button>
  </div>
</dialog>

<div class="toast" id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/encoding-japanese@2.5.0/encoding.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.core.min.js"></script>
<script>
{
/* ---------------- 状態 ---------------- */
const KEY = 'ramsounding-v1';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { if (v === null || v === undefined) return null; const s = String(v).trim().replace(/[０-９．－]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)); if (s === '') return null; const n = Number(s); return isFinite(n) ? n : null; };
const f2 = v => v == null ? '' : (Math.round(v * 100) / 100).toFixed(2);
const fN = v => { if (v == null) return ''; const r = Math.round(v * 10) / 10; return Number.isInteger(r) ? String(r) : r.toFixed(1); };

function samplePoint() {
  const ndm = [3,2,2,3,4, 2,1,1,2,2, 1,2,2,3,5, 7,9,11,12,10, 13,15,14,16,18, 17,15,19,22,24, 26,25,28,31,35, 38,42,47,55];
  const rows = ndm.map((b, i) => ({ d: f2((i + 1) * 0.2), b: String(b), p: '', mv: b > 5 ? String(Math.round((4 + i * 0.9) * 10) / 10) : '' }));
  return {
    info: { name: 'No.1（サンプル）', loc: '松山市土居田町 地内', elev: '12.35', date: '2026-11-20', weather: '晴れ', tester: '', gwl: '1.85', end: '貫入不能' },
    rows,
    layers: [
      { d: '0.60', soil: '盛土', note: '礫混じり砂、締まり緩い' },
      { d: '2.80', soil: '粘性土', note: 'Nd=1～3、軟らかい' },
      { d: '5.20', soil: '砂質土', note: '中位～密' },
      { d: '7.80', soil: '砂礫', note: 'Nd 急増、礫当たり' }
    ]
  };
}
function blankPoint(n) { return { info: { name: 'No.' + n, loc: '', elev: '', date: '', weather: '', tester: '', gwl: '', end: '' }, rows: [], layers: [] }; }
function defaults() {
  return {
    common: { job: '令和8年度 ○○地区 地質調査業務（サンプル）', company: '株式会社ナイバ', method: 'ラムサウンディング（63.5kg・落下高50cm・貫入量20cm）',
      k: '0.04', alpha: '1.0', scale: '50', showLayers: true, showN: false, gmax: '50', graph: 'line', gval: 'nd', gRef: false, out: 'simple', sBase: 'elev', ebase: 'T.P.', sLabel: 'over', sGap: '5' },
    cur: 0, points: [samplePoint()]
  };
}
let S;
try { S = JSON.parse(localStorage.getItem(KEY)) || defaults(); } catch (e) { S = defaults(); }
if (!S.points || !S.points.length) S = defaults();
if (!S.common.gval) { S.common.gval = 'nd'; S.common.graph = 'line'; S.common.gRef = false; }
if (!S.common.out) Object.assign(S.common, { out: 'simple', sBase: 'elev', ebase: 'T.P.', sLabel: 'over', sGap: '5' });
const P = () => S.points[S.cur];
let saveT;
function persist() { clearTimeout(saveT); saveT = setTimeout(() => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }, 300); }

/* ---------------- 計算 ---------------- */
function computed(pt, C) {
  const k = num(C.k) ?? 0.04, a = num(C.alpha) ?? 1;
  const rs = pt.rows.map(r => ({ d: num(r.d), b: num(r.b), p: num(r.p), mv: num(r.mv) })).filter(r => r.d != null && r.b != null).sort((x, y) => x.d - y.d);
  let prev = null;
  return rs.map(r => {
    const pen = r.p && r.p > 0 ? r.p : 200;
    const top = prev != null ? prev : Math.max(0, r.d - pen / 1000);
    prev = r.d;
    const ndm = r.b * 200 / pen;
    const nd = Math.max(0, ndm - k * (r.mv || 0));
    return { top, bot: r.d, b: r.b, pen, mv: r.mv, ndm, nd, n: nd * a };
  });
}
function calcRow(r, C) {
  const b = num(r.b); if (b == null) return null;
  const p = num(r.p); const pen = p && p > 0 ? p : 200;
  const ndm = b * 200 / pen, nd = Math.max(0, ndm - (num(C.k) ?? 0.04) * (num(r.mv) || 0));
  return { ndm, nd, n: nd * (num(C.alpha) ?? 1) };
}

/* ---------------- 作図（mm, 原点左下, A4縦） ---------------- */
const tw = (s, h) => { let w = 0; for (const ch of String(s)) { const c = ch.codePointAt(0); w += (c < 0x80 || (c >= 0xFF61 && c <= 0xFF9F)) ? 0.62 * h : 1.15 * h; } return w; };
function wrapText(s, maxW, h) {
  const out = [];
  for (const para of String(s).split(/\n/)) {
    let line = '';
    for (const ch of para) { if (tw(line + ch, h) > maxW && line) { out.push(line); line = ch; } else line += ch; }
    out.push(line);
  }
  return out.filter((l, i, a) => l !== '' || a.length === 1);
}
function Pen() {
  const E = [];
  return {
    E,
    L(x1, y1, x2, y2, ly = 'FRAME', c, lt) { E.push({ t: 'L', x1, y1, x2, y2, ly, c, lt }); },
    R(x1, y1, x2, y2, ly, c) { this.L(x1, y1, x2, y1, ly, c); this.L(x2, y1, x2, y2, ly, c); this.L(x2, y2, x1, y2, ly, c); this.L(x1, y2, x1, y1, ly, c); },
    S(x1, y1, x2, y2, ly, c) { E.push({ t: 'S', x1, y1, x2, y2, ly, c }); },
    C(x, y, r, ly, c) { E.push({ t: 'C', x, y, r, ly, c }); },
    D(x, y, r, ly, c) { E.push({ t: 'D', x, y, r, ly, c }); },
    T(x, y, s, h, ha = 0, va = 0, maxw, ly = 'TEXT', c) {
      s = String(s ?? ''); if (!s) return;
      let wf = 1; if (maxw) { const w = tw(s, h); if (w > maxw) wf = Math.max(0.45, maxw / w); }
      E.push({ t: 'T', x, y, s, h, ha, va, wf, ly, c });
    }
  };
}
const GV = { nd: '修正Nd値', ndm: '測定Ndm', n: '換算N値' };
const X0 = 20, X1 = 200, YT = 287, YB = 10, TITLE_B = 279, INFO_B = 254, HEAD_B = 242, FOOT_T = 16;

function columns(C) {
  const cols = [{ k: 'scale', w: 9, l: ['標尺', '(m)'] }];
  if (C.showLayers) cols.push({ k: 'elev', w: 12, l: ['標高', '(m)'] }, { k: 'thick', w: 10, l: ['層厚', '(m)'] }, { k: 'ldep', w: 11, l: ['深度', '(m)'] }, { k: 'soil', w: 17, l: ['推定', '土質'] }, { k: 'note', w: 25, l: ['記事'] });
  cols.push({ k: 'dep', w: 12, l: ['測定深度', '(m)'] }, { k: 'ndm', w: 11, l: ['打撃回数', 'Ndm'] }, { k: 'mv', w: 12, l: ['トルク', 'Mv(N・m)'] }, { k: 'nd', w: 10, l: ['修正', 'Nd'] });
  if (C.showN) cols.push({ k: 'n', w: 10, l: ['換算', 'N値'] });
  const used = cols.reduce((s, c) => s + c.w, 0);
  cols.push({ k: 'graph', w: (X1 - X0) - used, l: ['Nd値'] });
  let x = X0; for (const c of cols) { c.x = x; x += c.w; c.x2 = x; }
  return cols;
}

function buildSheets(pt, C) {
  const scale = num(C.scale) || 50, mpm = 1000 / scale;
  const per = Math.floor((HEAD_B - FOOT_T) / mpm);
  const rows = computed(pt, C);
  const layers = pt.layers.map(l => ({ d: num(l.d), soil: l.soil || '', note: l.note || '' })).filter(l => l.d != null).sort((a, b) => a.d - b.d);
  const gwl = num(pt.info.gwl), elev = num(pt.info.elev);
  const endD = rows.length ? rows[rows.length - 1].bot : 0;
  const total = Math.max(endD, layers.length ? layers[layers.length - 1].d : 0, gwl || 0, 1);
  const pages = Math.max(1, Math.ceil(total / per - 1e-9));
  const cols = columns(C), col = Object.fromEntries(cols.map(c => [c.k, c]));
  const gmax = num(C.gmax) || 50, gstep = gmax <= 20 ? 5 : 10;
  const g = col.graph, gx0 = g.x + 2, gx1 = g.x2 - 3, sx = (gx1 - gx0) / gmax;
  const k = num(C.k) ?? 0.04, al = num(C.alpha) ?? 1, gv = GV[C.gval] ? C.gval : 'nd';
  const out = [];
  for (let pg = 0; pg < pages; pg++) {
    const p = Pen(), top = pg * per, bot = top + per;
    const Y = d => HEAD_B - (d - top) * mpm;
    const yBot = Y(bot);
    const inPg = d => d >= top - 1e-9 && d <= bot + 1e-9;
    /* 外枠・タイトル */
    p.R(X0, YB, X1, YT, 'FRAME');
    p.L(X0, TITLE_B, X1, TITLE_B); p.L(X0, INFO_B, X1, INFO_B); p.L(X0, HEAD_B, X1, HEAD_B); p.L(X0, FOOT_T, X1, FOOT_T);
    p.T(110, 283, 'ラムサウンディング試験結果', 4.5, 1, 2);
    if (pages > 1) p.T(X1 - 2, 283, `${pg + 1} / ${pages}`, 2.5, 2, 2);
    /* 情報欄 */
    const I = pt.info, rh = (TITLE_B - INFO_B) / 5, lw = 20, vw = 70;
    const cells = [
      [['業務名', C.job, true]],
      [['調査地点', I.name], ['調査位置', I.loc]],
      [['孔口標高', elev != null ? `${f2(elev)} m` : I.elev], ['調査年月日', I.date]],
      [['試験者', I.tester], ['孔内水位', gwl != null ? `GL-${f2(gwl)} m` : I.gwl]],

/* ---------------- ZIP（無圧縮） ---------------- */
const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
const crc32 = u => { let c = 0xFFFFFFFF; for (let i = 0; i < u.length; i++) c = CRC[(c ^ u[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
function makeZip(files) {
  const enc = new TextEncoder(), parts = [], cen = []; let off = 0;
  const d = new Date(), dt = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate(), tm = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
  for (const f of files) {
    const nm = enc.encode(f.name), crc = crc32(f.data), sz = f.data.length;
    const lh = new DataView(new ArrayBuffer(30));
    [[0, 0x04034b50, 4], [4, 20, 2], [6, 0x0800, 2], [8, 0, 2], [10, tm, 2], [12, dt, 2], [14, crc, 4], [18, sz, 4], [22, sz, 4], [26, nm.length, 2], [28, 0, 2]].forEach(([o, v, n]) => n === 4 ? lh.setUint32(o, v, true) : lh.setUint16(o, v, true));
    parts.push(new Uint8Array(lh.buffer), nm, f.data);
    const ch = new DataView(new ArrayBuffer(46));
    [[0, 0x02014b50, 4], [4, 20, 2], [6, 20, 2], [8, 0x0800, 2], [10, 0, 2], [12, tm, 2], [14, dt, 2], [16, crc, 4], [20, sz, 4], [24, sz, 4], [28, nm.length, 2], [30, 0, 2], [32, 0, 2], [34, 0, 2], [36, 0, 2], [38, 0, 4], [42, off, 4]].forEach(([o, v, n]) => n === 4 ? ch.setUint32(o, v, true) : ch.setUint16(o, v, true));
    cen.push(new Uint8Array(ch.buffer), nm);
    off += 30 + nm.length + sz;
  }
  const csz = cen.reduce((s, a) => s + a.length, 0);
  const end = new DataView(new ArrayBuffer(22));
  [[0, 0x06054b50, 4], [4, 0, 2], [6, 0, 2], [8, files.length, 2], [10, files.length, 2], [12, csz, 4], [16, off, 4], [20, 0, 2]].forEach(([o, v, n]) => n === 4 ? end.setUint32(o, v, true) : end.setUint16(o, v, true));
  const all = [...parts, ...cen, new Uint8Array(end.buffer)], tot = all.reduce((s, a) => s + a.length, 0), u = new Uint8Array(tot);
  let p = 0; for (const a of all) { u.set(a, p); p += a.length; } return u;
}

/* ---------------- 保存（artifact では downloads 機能、ローカルでは直接） ---------------- */
let inArtifact = !!(window.claude && window.claude.use), dlP = null;
const getDl = () => { inArtifact = !!(window.claude && window.claude.use); if (!inArtifact) return Promise.resolve(null); return dlP || (dlP = Promise.resolve().then(() => window.claude.use('downloads')).catch(() => null)); };
setTimeout(() => { getDl().then(d => { if (inArtifact) $('#dlNote').textContent = d ? 'DXF は zip にまとめて保存されます' : ''; }); }, 0);
async function saveFile(name, data, allowDirect) {
  await getDl();
  if (!inArtifact) {
    const url = URL.createObjectURL(new Blob([data])); const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000); return;
  }
  const dl = await getDl();
  if (!dl) { toast('この表示ではファイル保存が使えません。claude.ai でページを開いてください'); return; }
  let fname = name, d = data;
  if (!allowDirect) { fname = name.replace(/\.[^.]+$/, '') + '.zip'; d = makeZip([{ name, data: typeof data === 'string' ? new TextEncoder().encode(data) : data }]); }
  try { await dl.save({ filename: fname, data: d }); toast('保存しました：' + fname); }
  catch (e) { if (e && e.code !== 'declined') toast('保存できませんでした（' + (e.code || e) + '）'); }
}
async function saveDXFs(files, zipName) {
  await getDl();
  if (!inArtifact) { for (const f of files) await saveFile(f.name, f.data, true); return; }
  const dl = await getDl();
  if (!dl) { toast('この表示ではファイル保存が使えません'); return; }
  try { await dl.save({ filename: zipName, data: makeZip(files) }); toast('保存しました：' + zipName); }
  catch (e) { if (e && e.code !== 'declined') toast('保存できませんでした（' + (e.code || e) + '）'); }
}

    <h3 class="full">簡易柱状図（断面図貼付用）</h3>
    <p class="note full">1 図面単位 = 1m の実寸で描きます（グラフ幅 2.5m）。貼り付け先の縮尺に合わせて CAD で尺度変更してください。</p>
    <label for="s_sBase">縦位置の基準</label><select id="s_sBase" data-k="sBase"><option value="elev">孔口標高に合わせる（Y = 標高）</option><option value="zero">孔口を Y = 0 に置く</option></select>
    <label for="s_ebase">標高の表記</label><input id="s_ebase" data-k="ebase" value="${esc(C.ebase ?? 'T.P.')}">
    <label for="s_sLabel">数値ラベル</label><select id="s_sLabel" data-k="sLabel"><option value="over">最大値超えのみ（→62 の形）</option><option value="all">全点（20cm 間隔では重なりやすい）</option><option value="none">なし</option></select>
    <label for="s_sGap">全地点の間隔 (m)</label><input id="s_sGap" data-k="sGap" value="${esc(C.sGap ?? '5')}" inputmode="decimal">
    <p class="note full">「全地点を DXF」で地点を横に並べるときの間隔です。</p>`;
  $('#s_scale').value = C.scale; $('#s_gmax').value = C.gmax; $('#s_graph').value = C.graph; $('#s_gval').value = C.gval || 'nd'; $('#s_sBase').value = C.sBase || 'elev'; $('#s_sLabel').value = C.sLabel || 'over';
}
$('#fSet').addEventListener('input', e => {
  const t = e.target, k = t.dataset.k; if (!k) return;
  S.common[k] = t.type === 'checkbox' ? t.checked : t.value;
  if (['k', 'alpha', 'showN', 'scale'].includes(k)) renderData();
  if (k === 'showLayers') $('#qSoil').checked = t.checked;
  schedule();
});

/* プレビュー */
let prevT;
function schedule() { persist(); clearTimeout(prevT); prevT = setTimeout(renderPreview, 120); }
function renderPreview() {
  document.querySelectorAll('#seg button').forEach(b => b.classList.toggle('on', b.dataset.out === S.common.out));
  $('#qSoil').checked = !!S.common.showLayers;
  if (S.common.out === 'simple') {
    const E = buildSimple(P(), S.common), b = bboxOf(E), pad = 0.25, bb = [b[0] - pad, b[1] - pad, b[2] + pad, b[3] + pad], w = bb[2] - bb[0], h = bb[3] - bb[1];
    $('#pages').innerHTML = `<div class="sheet" style="aspect-ratio:${w.toFixed(3)}/${h.toFixed(3)};width:min(100%, calc(76vh * ${(w / h).toFixed(4)}))">${toSVG(E, { bb, sw: 0.025 })}</div>`;
  } else {
    const sh = buildSheets(P(), S.common);
    $('#pages').innerHTML = sh.map(E => `<div class="paper">${toSVG(E)}</div>`).join('');
  }
}
$('#seg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; S.common.out = b.dataset.out; schedule(); renderPreview(); });
$('#qSoil').onchange = e => { S.common.showLayers = e.target.checked; renderSet(); schedule(); };
function renderAll() { renderPts(); renderData(); renderLayers(); renderInfo(); renderSet(); renderPreview(); persist(); }

/* 出力 */
function dxfForPoint(pt, oy = 0, i = 0) {
  if (S.common.out === 'simple') return [{ E: buildSimple(pt, S.common), ox: i * (num(S.common.sGap) || 5), oy: 0 }];
  return buildSheets(pt, S.common).map((E, j) => ({ E, ox: j * 230, oy }));
}
const outTag = () => S.common.out === 'simple' ? '_簡易柱状図' : '_柱状図';
$('#bDxf').onclick = () => {
  const pt = P(), name = safeName(pt.info.name) + outTag() + '.dxf';
  if (!computed(pt, S.common).length) { toast('データがありません'); return; }
  const data = buildDXF(dxfForPoint(pt));
  saveDXFs([{ name, data }], name.replace(/\.dxf$/, '') + '_DXF.zip');
};
$('#bDxfAll').onclick = () => {
  const sheets = []; S.points.forEach((pt, i) => sheets.push(...dxfForPoint(pt, -i * 320, i)));
  const name = safeName(S.common.job || 'ram') + outTag() + '_全地点.dxf';
  const data = buildDXF(sheets);
  saveDXFs([{ name, data }], name.replace(/\.dxf$/, '') + '_DXF.zip');
};
$('#bCsv').onclick = () => {
  const C = S.common, rows = computed(P(), C);
  const head = ['上端深度(m)', '下端深度(m)', '打撃回数', '貫入量(mm)', 'Mv(N・m)', 'Ndm', '修正Nd'].concat(C.showN ? ['換算N'] : []);
  const lines = [head.join(',')].concat(rows.map(r => [f2(r.top), f2(r.bot), r.b, r.pen, r.mv ?? '', fN(r.ndm), fN(r.nd)].concat(C.showN ? [fN(r.n)] : []).join(',')));
  saveFile(safeName(P().info.name) + '_Nd.csv', '﻿' + lines.join('\r\n'), true);
};
$('#bSave').onclick = () => saveFile(safeName(S.common.job || 'ram') + '.ramsounding.json', JSON.stringify(S, null, 1), true);
$('#bOpen').onclick = () => $('#fProj').click();
$('#fProj').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try { const d = JSON.parse(await f.text()); if (!d.points) throw 0; S = d; S.cur = 0; renderAll(); toast('プロジェクトを開きました'); } catch (er) { toast('読み込めないファイルです'); }
  e.target.value = '';
};

/* ---------------- Excel / CSV 取込 ---------------- */
let WB = null, AOA = [];
const FIELDS = [['d', '深度', /深|depth|GL/i], ['b', '打撃回数', /打撃|回数|Ndm|blow/i], ['p', '貫入量', /貫入|pen/i], ['mv', 'トルク Mv', /トルク|Mv|torque/i]];
$('#bImport').onclick = () => $('#fXls').click();
$('#fXls').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const buf = new Uint8Array(await f.arrayBuffer());
    if (/\.(csv|txt)$/i.test(f.name)) {
      const enc = Encoding.detect(buf); const str = Encoding.codeToString(Encoding.convert(buf, { to: 'UNICODE', from: enc === 'UTF8' || enc === 'UNICODE' ? 'UTF8' : (enc || 'SJIS') }));
      WB = XLSX.read(str.replace(/^﻿/, ''), { type: 'string', raw: true });
    } else WB = XLSX.read(buf, { type: 'array' });
    $('#iSheet').innerHTML = WB.SheetNames.map((n, i) => `<option value="${i}">${esc(n)}</option>`).join('');
    loadSheet(0); $('#dImp').showModal();
  } catch (er) { toast('ファイルを読み込めませんでした'); }
};
function loadSheet(i) {
  const ws = WB.Sheets[WB.SheetNames[i]];
  AOA = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: '' }).filter(r => r.some(v => String(v).trim() !== ''));
  let hr = 0;
  for (let r = 0; r < Math.min(15, AOA.length); r++) if (AOA[r].some(v => FIELDS.some(f => f[2].test(String(v))) && isNaN(Number(v)))) { hr = r + 1; break; }
  $('#iHead').value = hr; buildMap();
}
function buildMap() {
  const hr = +$('#iHead').value || 0, head = hr ? AOA[hr - 1] : [];
  const ncol = Math.max(0, ...AOA.slice(0, 50).map(r => r.length));
  const L = i => XLSX.utils.encode_col(i) + (head[i] !== undefined && head[i] !== '' ? '：' + String(head[i]).replace(/\s+/g, '') : '');
  $('#iPrev').innerHTML = '<table>' + AOA.slice(0, 12).map((r, i) => `<tr class="${i === hr - 1 ? 'hd' : ''}"><td>${i + 1}</td>${Array.from({ length: ncol }, (_, j) => `<td>${esc(r[j])}</td>`).join('')}</tr>`).join('') + '</table>';
  $('#iMap').innerHTML = FIELDS.map(([k, lab, re]) => {
    let guess = head.findIndex(v => re.test(String(v)));
    if (guess < 0 && !hr) guess = { d: 0, b: 1, p: -1, mv: -1 }[k];
    return `<label for="m_${k}">${lab}</label><select id="m_${k}" data-k="${k}"><option value="-1">（なし）</option>${Array.from({ length: ncol }, (_, j) => `<option value="${j}" ${j === guess ? 'selected' : ''}>${esc(L(j))}</option>`).join('')}</select>`;
  }).join('');
  $('#iAuto').checked = $('#m_d').value === '-1';
}
$('#iSheet').onchange = e => loadSheet(+e.target.value);
$('#iHead').oninput = buildMap;
$('#iMap').addEventListener('change', () => { if ($('#m_d').value === '-1') $('#iAuto').checked = true; });
$('#iCancel').onclick = () => $('#dImp').close();
$('#iOk').onclick = () => {
  const hr = +$('#iHead').value || 0, m = Object.fromEntries(FIELDS.map(([k]) => [k, +$('#m_' + k).value]));
  if (m.b < 0) { toast('打撃回数の列を指定してください'); return; }
  const rows = [];
  for (const r of AOA.slice(hr)) {
    const b = num(r[m.b]); if (b == null) continue;
    rows.push({ d: m.d >= 0 && num(r[m.d]) != null ? f2(num(r[m.d])) : '', b: String(b), p: m.p >= 0 && num(r[m.p]) != null ? String(num(r[m.p])) : '', mv: m.mv >= 0 && num(r[m.mv]) != null ? String(num(r[m.mv])) : '' });
  }
  if (!rows.length) { toast('数値の行が見つかりませんでした'); return; }
  const dest = $('#iDest').value;
  if (dest === 'new') { const p = blankPoint(S.points.length + 1); p.rows = rows; S.points.push(p); S.cur = S.points.length - 1; }
  else if (dest === 'append') P().rows.push(...rows); else P().rows = rows;
  if ($('#iAuto').checked) fillDepths(P().rows);
  $('#dImp').close(); renderAll(); toast(`${rows.length} 行を取り込みました`);
};

window.__ram = { buildSheets, buildDXF, dxfForPoint, get S() { return S; }, makeZip };
renderAll();
}
</script>
</body>
</html>
